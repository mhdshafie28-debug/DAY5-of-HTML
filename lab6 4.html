<!DOCTYPE html>
<html>
<head>
    <title>Bookstore Discount</title>
</head>
<body>

    <h2>Bookstore Discount</h2>

    <p id="result"></p>

    <script>
        let purchase = 250;
        let discount;
        let finalPayment;

        if (purchase >= 200) {
            discount = 20;
        }
        else if (purchase >= 100) {
            discount = 10;
        }
        else {
            discount = 0;
        }

        finalPayment = purchase - (purchase * discount / 100);

        document.getElementById("result").innerHTML =
            "Purchase Amount: RM" + purchase + "<br>" +
            "Discount: " + discount + "%<br>" +
            "Final Payment: RM" + finalPayment.toFixed(2);
    </script>

</body>
</html>
